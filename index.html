<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELITE POLO</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
.promo{background:#111;color:#fff;text-align:center;font-size:13px;padding:8px}
.brand{background:#172038;text-align:center;padding:6px 0}
.brand img{width:280px;max-width:90%;height:220px;object-fit:cover;object-position:center 47%;display:block;margin:0 auto}
.hero{background:#f3f3f3;text-align:center;padding:32px 16px}
.hero h2{margin:0 0 8px;font-size:24px}
.hero p{margin:0;color:#666}
h3{padding:0 16px;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 32px;max-width:900px;margin:0 auto}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block}
.name{font-size:13px;margin:8px 0 2px}
.price{font-size:14px;font-weight:bold;margin-bottom:8px}
.sizes{display:flex;gap:4px;margin-bottom:8px}
.sz{flex:1;padding:7px 0;border:1px solid #ccc;background:#fff;font-size:12px;cursor:pointer}
.sz.on{background:#111;color:#fff;border-color:#111}
.add{width:100%;padding:11px;background:#111;color:#fff;border:0;font-size:13px;cursor:pointer}
footer{background:#f3f3f3;text-align:center;padding:24px 16px;font-size:13px;color:#666}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;max-height:94vh;overflow:auto;padding:16px;max-width:600px;margin:0 auto}
.sheet h4{margin:0 0 12px;font-size:18px}
.close{float:left;background:none;border:0;font-size:22px;cursor:pointer}
.sumrow{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #eee}
.qty button{width:28px;height:28px;border:1px solid #ccc;background:#fff;font-size:16px;cursor:pointer}
.qty span{display:inline-block;min-width:24px;text-align:center}
.total{display:flex;justify-content:space-between;font-weight:bold;font-size:17px;padding:12px 0}
.opts{display:flex;gap:8px;margin:10px 0}
.opt{flex:1;padding:12px 6px;border:1px solid #ccc;background:#fff;font-size:13px;cursor:pointer;line-height:1.5}
.opt.on{background:#111;color:#fff;border-color:#111}
input,select{width:100%;padding:12px;margin:0 0 10px;border:1px solid #ccc;font-size:15px;background:#fff}
.confirm{width:100%;padding:14px;background:#111;color:#fff;border:0;font-size:15px;cursor:pointer}
.note{font-size:12px;color:#777;margin:8px 0 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;font-size:13px;display:none;z-index:30}
</style>
</head>
<body>
<div class="promo">الدفع عند الاستلام · التوصيل لكل الولايات</div>
<div class="brand"><img src="FB_IMG_1794912391133.jpg" alt="ELITE POLO"></div>
<section class="hero">
  <h2>أناقة بسيطة. جودة تدوم.</h2>
  <p>تشكيلة بولو جديدة</p>
</section>
<h3>وصل حديثاً</h3>
<div class="grid" id="grid"></div>
<footer>© ELITE POLO — جميع الحقوق محفوظة</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" onclick="closeOrder()">✕</button>
    <h4>إتمام الطلب</h4>
    <div id="sum"></div>
    <div style="font-size:14px;margin-top:10px">نوع التوصيل:</div>
    <div class="opts">
      <button class="opt" id="optOffice" onclick="setDelivery('office')">إلى المكتب<br>500 دج</button>
      <button class="opt" id="optHome" onclick="setDelivery('home')">إلى المنزل<br>750 دج</button>
    </div>
    <input id="fname" placeholder="الاسم الكامل">
    <input id="fphone" placeholder="رقم الهاتف (مثال: 0555123456)" inputmode="tel">
    <select id="fwilaya"><option value="">اختر الولاية</option></select>
    <input id="faddr" placeholder="البلدية / العنوان">
    <button class="confirm" onclick="sendOrder()">تأكيد الطلب</button>
    <p class="note">الدفع عند الاستلام. سيصلك تأكيد الطلب على واتساب.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WHATSAPP = "213772342854";
const SHEETS_URL = "";
const SIZES = ["S","M","L","XL"];
const DELIVERY = {office:{label:"المكتب", cost:500}, home:{label:"المنزل", cost:750}};
const PRODUCTS = [
  {id:1, name:"Polo Eden Park", img:"IMG_20261013_172028_828.jpg", price:5500},
  {id:2, name:"Polo Eden Park", img:"IMG_20261013_172029_114.jpg", price:5500},
  {id:3, name:"Polo Eden Park", img:"IMG_20261013_172052_857.jpg", price:5500},
  {id:4, name:"Polo Eden Park", img:"IMG_20261013_172227.jpg", price:5500}
];
const WILAYAS = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام","تقرت","جانت","المغير","المنيعة"];

const sel = {};
let cur = null;
let deliv = "";
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US") + " دج";

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(()=>{ t.style.display = "none"; }, 2000);
}

function renderProducts(){
  $("grid").innerHTML = PRODUCTS.map(p => `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <div class="name">${p.name} - موديل ${p.id}</div>
      <div class="price">${fmt(p.price)}</div>
      <div class="sizes">
        ${SIZES.map(s => `<button class="sz ${sel[p.id]===s?"on":""}" onclick="pick(${p.id},'${s}')">${s}</button>`).join("")}
      </div>
      <button class="add" onclick="openOrder(${p.id})">اطلب الآن</button>
    </div>`).join("");
}

function pick(id, s){ sel[id] = s; renderProducts(); }

function openOrder(id){
  if(!sel[id]){ toast("اختر المقاس أولاً"); return; }
  cur = {id:id, size:sel[id], qty:1};
  deliv = "";
  $("optOffice").className = "opt";
  $("optHome").className = "opt";
  $("faddr").placeholder = "البلدية / العنوان";
  renderSummary();
  $("overlay").style.display = "block";
}

function closeOrder(){ $("overlay").style.display = "none"; }

function setDelivery(d){
  deliv = d;
  $("optOffice").className = "opt" + (d==="office" ? " on" : "");
  $("optHome").className = "opt" + (d==="home" ? " on" : "");
  $("faddr").placeholder = d==="office" ? "اسم المكتب / البلدية" : "العنوان الكامل / البلدية";
  renderSummary();
}

function changeQty(d){
  cur.qty += d;
  if(cur.qty < 1) cur.qty = 1;
  if(cur.qty > 10) cur.qty = 10;
  renderSummary();
}

function calc(){
  const p = PRODUCTS.find(x=>x.id===cur.id);
  const sub = p.price * cur.qty;
  const dc = deliv ? DELIVERY[deliv].cost : 0;
  return {p:p, sub:sub, dc:dc, total:sub+dc};
}

function renderSummary(){
  const c = calc();
  $("sum").innerHTML = `
    <div class="sumrow"><div>${c.p.name} - موديل ${c.p.id}<br><small>المقاس: ${cur.size}</small></div>
      <div class="qty"><button onclick="changeQty(-1)">−</button><span>${cur.qty}</span><button onclick="changeQty(1)">+</button></div></div>
    <div class="sumrow"><span>سعر المنتج</span><span>${fmt(c.sub)}</span></div>
    <div class="sumrow"><span>التوصيل</span><span>${deliv ? fmt(c.dc) : "اختر نوع التوصيل"}</span></div>
    <div class="total"><span>المجموع</span><span>${fmt(c.total)}</span></div>`;
}

function sendOrder(){
  const name = $("fname").value.trim();
  const phone = $("fphone").value.trim().replace(/\s/g,"");
  const wilaya = $("fwilaya").value;
  const addr = $("faddr").value.trim();
  if(!deliv){ toast("اختر نوع التوصيل"); return; }
  if(!name){ toast("اكتب اسمك"); return; }
  if(!/^0[567][0-9]{8}$/.test(phone)){ toast("رقم الهاتف غير صحيح"); return; }
  if(!wilaya){ toast("اختر الولاية"); return; }
  if(!addr){ toast("اكتب العنوان"); return; }

  const c = calc();
  const msg = "طلب جديد - ELITE POLO\n\n" +
    "الاسم: " + name + "\nالهاتف: " + phone + "\nالولاية: " + wilaya + "\nالعنوان: " + addr +
    "\n\nالمنتج: " + c.p.name + " موديل " + c.p.id + "\nالمقاس: " + cur.size + "\nالكمية: " + cur.qty +
    "\nسعر المنتج: " + fmt(c.sub) +
    "\nالتوصيل إلى " + DELIVERY[deliv].label + ": " + fmt(c.dc) +
    "\n\nالمجموع: " + fmt(c.total) + " (الدفع عند الاستلام)";

  if(SHEETS_URL){
    try{
      fetch(SHEETS_URL, {method:"POST", mode:"no-cors", body: JSON.stringify({name:name, phone:phone, wilaya:wilaya, address:addr, product:c.p.name + " موديل " + c.p.id, size:cur.size, qty:cur.qty, delivery:DELIVERY[deliv].label, total:c.total})});
    }catch(e){}
  }
  window.location.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
}

WILAYAS.forEach((w,i) => {
  const o = document.createElement("option");
  o.value = w; o.textContent = (i+1) + " - " + w;
  $("fwilaya").appendChild(o);
});
renderProducts();
</script>
</body>
</html>
